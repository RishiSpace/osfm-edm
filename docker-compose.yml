services:
  db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: osfm_edm
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: osfm_edm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osfm_edm"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://osfm_edm:secret@db:5432/osfm_edm
      JWT_SECRET: change_me_to_a_long_random_string_at_least_64_chars
      SERVER_PORT: "8080"
      AGENT_PORT: "8443"
      SERVER_URL: "https://localhost:8443"
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: change_me_immediately
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - server_data:/app/data

  # Optional Chromium-based UI. Prefer the native console:
  #   cargo run -p osfm-edm-console -- --api http://localhost:8080
  dashboard:
    profiles: ["web"]
    build:
      context: .
      dockerfile: Dockerfile.dashboard
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "3000:3000"

volumes:
  pgdata:
  server_data:
