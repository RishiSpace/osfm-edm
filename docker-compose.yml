services:
  db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: osfm_edm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: osfm_edm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osfm_edm"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # REQUIRED — generate before first deploy, e.g.:
      #   openssl rand -hex 32   (JWT_SECRET, POSTGRES_PASSWORD)
      #   openssl rand -hex 16   (ADMIN_PASSWORD)
      DATABASE_URL: postgres://osfm_edm:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/osfm_edm
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (min 32 chars)}
      SERVER_PORT: "8080"
      SERVER_URL: "https://localhost:8080"
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "8080:8080"
    volumes:
      - server_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -skf https://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
      - /run
    security_opt:
      - no-new-privileges:true

  # Optional Chromium-based UI. Prefer the native console:
  #   cargo run -p osfm-edm-console -- --api http://localhost:8080
  dashboard:
    profiles: ["web"]
    build:
      context: .
      dockerfile: Dockerfile.dashboard
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "3000:3000"

volumes:
  pgdata:
  server_data:
